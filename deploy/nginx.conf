# Replace example.com. TLS via certbot. Real client IP is passed to the apps; no IP is written to the access log.
log_format noip '$time_iso8601 "$request_method $uri" $status $body_bytes_sent';
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 443 ssl http2;
  server_name example.com;
  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  access_log /var/log/nginx/sync.access.log noip;
  client_max_body_size 1m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
  }
  location /socket.io/ {
    proxy_pass http://127.0.0.1:4001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
  }
  # blog images: the app shows blog articles itself now, so it serves /media too (served straight from disk)
  location /media/ { alias /var/sync/media/; expires 30d; add_header Cache-Control "public, immutable"; }
  # The blog (server rendered, for search engines) is served from this same address under /blog; everything else is the app.
  # Build the blog with NUXT_APP_BASE_URL=/blog/ (see docs/blog-on-main-domain.md). No path after the address in proxy_pass: /blog/... is passed as it is.
  location = /blog { return 301 /blog/; }
  location /blog/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
server { listen 80; server_name example.com; return 301 https://$host$request_uri; }

# Old blog address: blog.example.com moves permanently to example.com/blog, page for page (blog.example.com/my-post -> example.com/blog/my-post).
# The Bing verification file stays reachable on the old address so that Bing keeps the site verified.
server {
  listen 443 ssl http2;
  server_name blog.example.com;
  ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
  location = /BingSiteAuth.xml { proxy_pass http://127.0.0.1:3001/blog/BingSiteAuth.xml; }
  location / { return 301 https://example.com/blog$request_uri; }
}
server { listen 80; server_name blog.example.com; return 301 https://example.com/blog$request_uri; }

# (The older setup, the blog on its own host blog.example.com with its own server block, still works: leave NUXT_APP_BASE_URL unset.)
#
# Admin panel on its own host: static build of admin/dist, /api and /media proxied.
server {
  listen 443 ssl http2;
  server_name admin.example.com;
  ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
  access_log /var/log/nginx/sync.admin.log noip;
  client_max_body_size 11m;
  root /var/sync/app/admin/dist;
  location /api/ { proxy_pass http://127.0.0.1:4000; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Host $host; }
  location /media/ { alias /var/sync/media/; expires 30d; }
  # Security headers for the panel (repeated here because nginx drops server-level add_header lines in a location that has its own).
  # The full Content-Security-Policy is added by `node admin/server.mjs`; if you serve admin/dist straight from nginx instead, add a CSP of your own.
  location / { try_files $uri /index.html; add_header X-Robots-Tag "noindex, nofollow"; add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; add_header X-Frame-Options "DENY" always; add_header X-Content-Type-Options "nosniff" always; add_header Referrer-Policy "same-origin" always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always; }
}
