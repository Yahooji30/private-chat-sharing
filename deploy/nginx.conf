# Replace example.com. TLS via certbot. Real client IP is passed to the apps; no IP is written to the access log.
log_format noip '$time_iso8601 "$request_method $uri" $status $body_bytes_sent';
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 443 ssl http2;
  server_name example.com;
  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  access_log /var/log/nginx/sync.access.log noip;
  client_max_body_size 1m;

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
  }
  location /socket.io/ {
    proxy_pass http://127.0.0.1:4001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
  }
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
server { listen 80; server_name example.com; return 301 https://$host$request_uri; }

# Blog site on its own host (blog.example.com -> 127.0.0.1:3001, set BLOG_PUBLIC_URL and NUXT_PUBLIC_SITE_URL to it); its server block needs:
#   location /media/ { alias /var/sync/media/; expires 30d; add_header Cache-Control "public, immutable"; }
#   location / { proxy_pass http://127.0.0.1:3001; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
# Blog images, served straight from disk:
# (add inside the blog server block):
#   location /media/ { alias /var/sync/media/; expires 30d; add_header Cache-Control "public, immutable"; }
#
# Admin panel on its own host: static build of admin/dist, /api and /media proxied.
server {
  listen 443 ssl http2;
  server_name admin.example.com;
  ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
  access_log /var/log/nginx/sync.admin.log noip;
  client_max_body_size 11m;
  root /var/sync/app/admin/dist;
  location /api/ { proxy_pass http://127.0.0.1:4000; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Host $host; }
  location /media/ { alias /var/sync/media/; expires 30d; }
  location / { try_files $uri /index.html; add_header X-Robots-Tag "noindex, nofollow"; }
}
